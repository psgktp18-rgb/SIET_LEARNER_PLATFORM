name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to deploy/rollback to (defaults to latest)'
        required: false

jobs:
  deploy:
    name: Deploy to SIET Server
    runs-on: [self-hosted, siet-server]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Record Current Image Tag
        id: record_tag
        run: |
          # Fetch the currently running image tag for rollback
          CURRENT_TAG=$(docker inspect --format='{{.Config.Image}}' lecture-lens-app || echo "none")
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Image (Local Registry or GHCR)
        run: |
          docker build -t ghcr.io/siet/lecture-lens:${{ github.sha }} .
          docker tag ghcr.io/siet/lecture-lens:${{ github.sha }} ghcr.io/siet/lecture-lens:latest
          # docker push ghcr.io/siet/lecture-lens:${{ github.sha }}

      - name: Backup Database & Uploads
        run: |
          chmod +x backup.sh
          ./backup.sh
          
      - name: Maintenance Mode ON
        run: |
          echo "Turning on maintenance mode (implementation specific)"
          # e.g., touch /var/www/html/maintenance.flag

      - name: Database Migrations
        run: |
          # Assuming prisma is in the path or docker run
          npx prisma migrate deploy

      - name: Docker Compose Up
        run: |
          docker compose up -d app
          # Do not restart Ollama to prevent model redownloads unless needed

      - name: Wait for Health Check
        run: |
          echo "Waiting for /api/health..."
          for i in {1..24}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "App is healthy!"
              exit 0
            fi
            echo "Waiting 5s..."
            sleep 5
          done
          echo "Health check failed!"
          exit 1

      - name: Maintenance Mode OFF
        if: always()
        run: |
          echo "Turning off maintenance mode"
          # rm -f /var/www/html/maintenance.flag

      - name: Automatic Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed! Rolling back to ${{ steps.record_tag.outputs.current_tag }}"
          if [ "${{ steps.record_tag.outputs.current_tag }}" != "none" ]; then
            # Update docker-compose to use the old tag and restart
            docker compose up -d app
            echo "Rollback initiated. Check logs."
            # Note: DB rollback is trickier; ideally restore from the backup just taken:
            # cp backups/latest_db.sqlite3 dev.db
          fi
          exit 1
