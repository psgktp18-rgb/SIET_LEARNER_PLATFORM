name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prettier Check
        run: npx prettier --check .
        continue-on-error: true

      - name: ESLint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

  test:
    name: Tests and Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lecture_lens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://prisma:password@localhost:5432/lecture_lens_test?schema=public"
      AI_PROVIDER: "mock"
      AI_PRIMARY: "mock"
      AI_FALLBACK: "mock"
      JWT_SECRET: "test_secret_must_be_at_least_32_characters_long"
      NODE_ENV: "test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Push Schema to Test Database
        run: npx prisma db push --skip-generate

      - name: Run Unit Tests
        run: npm test --if-present
        continue-on-error: true

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/dummy_db?schema=public"
      JWT_SECRET: "dummy_super_secret_jwt_key_at_least_32_characters_long"
      AI_PROVIDER: "mock"
      AI_PRIMARY: "gemini"
      AI_FALLBACK: "gemini"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: "production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build Next.js App
        run: npm run build

      - name: Cache Build Artifacts
        uses: actions/cache@v4
        with:
          path: .next
          key: ${{ runner.os }}-nextjs-${{ github.sha }}

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
