version: '3.8'

services:
  postgres-loadtest:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest_password
      POSTGRES_DB: lecture_lens_loadtest
    ports:
      - "5432:5432"
    volumes:
      - postgres-loadtest-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    command: 
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=16MB"

volumes:
  postgres-loadtest-data:
